apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-netshoot
  namespace: kube-system
  labels:
      app: nginx-netshoot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-netshoot
  template:
    metadata:
      labels:
        app: nginx-netshoot
    spec:
      serviceAccount: ebs-csi-controller-sa
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
      - name: nginx
        image: nginx:1.14.2
        ports:
            - containerPort: 80
      - name: netshoot
        image: nicolaka/netshoot
        command: ["/bin/bash"]
        args: ["-c", "while true; do ping -c1 localhost; sleep 60;done"]